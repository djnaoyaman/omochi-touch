name: Site update date
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  date:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/site-update-date.py --check
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/site-update-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-update-date-review
          path: test-artifacts/site-update/
          retention-days: 7
          if-no-files-found: error
